name: Checks

# Types, lint and tests on every push and pull request. The audit's point was
# that nothing enforced these: a broken lint command had gone unnoticed and a
# TypeScript escape hatch was sitting in the Next config.
# Work is pushed to redesign and to main together, so watching both sent two
# runs — and two emails — for every commit. Production is main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      # Production dependencies only; 0 known issues on 2026-09-24. A new high
      # or critical advisory fails the run instead of accumulating silently.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  browser:
    # Public pages plus one authenticated member journey in a real browser.
    # The database is an isolated service container; production is never read.
    runs-on: ubuntu-latest
    # The suite takes about a minute. On 09-23 a runner hung for 40+ minutes on
    # a commit that passes locally in 43 s; a hung job should fail fast instead.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: statyk
          POSTGRES_PASSWORD: statyk
          POSTGRES_DB: statyk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U statyk -d statyk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://statyk:statyk@127.0.0.1:5432/statyk_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3210
      E2E_PORT: '3210'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Seed isolated member database
        run: node --experimental-strip-types scripts/seed-member-ci.ts
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
