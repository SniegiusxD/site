name: Checks

# Types, lint and tests on every push and pull request. The audit's point was
# that nothing enforced these: a broken lint command had gone unnoticed and a
# TypeScript escape hatch was sitting in the Next config.
# Work is pushed to redesign and to main together, so watching both sent two
# runs — and two emails — for every commit. Production is main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test

  browser:
    # The public pages in a real browser: they must render from a production
    # build with no database reachable, keep one h1, never scroll sideways, and
    # pass axe at 1440 px and on a phone.
    runs-on: ubuntu-latest
    # The suite takes about a minute. On 09-23 a runner hung for 40+ minutes on
    # a commit that passes locally in 43 s; a hung job should fail fast instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
