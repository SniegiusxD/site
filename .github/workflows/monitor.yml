name: Monitor

# Every 30 minutes: is the live site answering, and has the scanner published
# in the last 90 minutes? A failed scheduled run makes GitHub email the repo
# owner — the alert that was missing when the scanner stood still for 3.5 hours
# on 2026-09-24. Runs from GitHub, so it also fires when the VM itself is down.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site and scanner health
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o body.json -w '%{http_code}' --max-time 30 https://predictions-dashboard-two.vercel.app/api/health || echo 000)
            echo "attempt $attempt: HTTP $status $(cat body.json 2>/dev/null)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 60
          done
          # Name the cause in the title, so the email and the run list say what broke
          # (lib/health.ts: stale, results-stale, database, no-status) without opening the log.
          problem=$(jq -r '.problem // "unknown"' body.json 2>/dev/null || echo "no body")
          minutes=$(jq -r '.minutesSincePublish // "?"' body.json 2>/dev/null || echo "?")
          echo "::error title=Health: $problem::HTTP $status, minutes since publish $minutes. $(cat body.json 2>/dev/null)"
          {
            echo "### Health check failed: \`$problem\`"
            echo "HTTP $status, minutes since the scanner last published: $minutes."
            echo "stale = scanner (VM) · results-stale = grading/settle timer · database = Neon · no-status = VM never wrote runner_status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
